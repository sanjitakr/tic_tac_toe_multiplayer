<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TIC-TAC-TOE // ARENA</title>
    <link rel="stylesheet" href="/game.css" />
</head>
<body>
    <div class="bg-symbols">
    <span class="bg-x" style="top:6%; left:4%; font-size:6rem;">X</span>
    <span class="bg-o" style="top:12%; left:42%; font-size:4rem;">O</span>
    <span class="bg-x" style="top:8%; right:6%; font-size:5rem;">X</span>

    <span class="bg-o" style="top:30%; left:10%; font-size:5rem;">O</span>
    <span class="bg-x" style="top:34%; left:46%; font-size:4.5rem;">X</span>
    <span class="bg-o" style="top:28%; right:8%; font-size:6rem;">O</span>

    <span class="bg-x" style="top:56%; left:5%; font-size:4rem;">X</span>
    <span class="bg-o" style="top:60%; left:40%; font-size:5rem;">O</span>
    <span class="bg-x" style="top:54%; right:6%; font-size:5rem;">X</span>

    <span class="bg-o" style="bottom:18%; left:12%; font-size:5rem;">O</span>
    <span class="bg-x" style="bottom:10%; left:48%; font-size:6rem;">X</span>
    <span class="bg-o" style="bottom:8%; right:10%; font-size:5rem;">O</span>
   </div>   



    <div class="scanlines"></div>
    <div class="noise"></div>

    <header class="header">
        <div class="logo">
            <span class="logo-bracket">[</span>GAMEPLAY<span class="logo-bracket">]</span>
            <span class="logo-sub">ARENA</span>
        </div>
        <div class="header-right">
            <span class="label">ROOM</span>
            <span id="room-display" class="uid-display">—</span>
            <a href="/leaderboard" class="nav-link">LEADERBOARD</a>
        </div>
    </header>

    <main class="game-layout">

        <div class="player-panel" id="panel-x">
            <div class="player-label">OPERATOR X</div>
            <div id="name-x" class="player-name">—</div>
            <div class="symbol-badge x-badge">X</div>
        </div>

        <div class="arena">
            <div id="status-bar" class="status-bar">CONNECTING…</div>

            <div id="board" class="board"></div>

            <div id="result-overlay" class="result-overlay hidden">
                <div class="result-text" id="result-text"></div>
                <div id="elo-info" class="elo-info" style="display:none"></div>
                <div class="result-actions">
                    <button id="rematch-btn" class="btn btn-accept">⟳ REMATCH</button>
                    <a href="/lobby" class="btn btn-decline">◀ LOBBY</a>
                </div>
            </div>
        </div>

        <div class="player-panel" id="panel-o">
            <div class="player-label">OPERATOR O</div>
            <div id="name-o" class="player-name">—</div>
            <div class="symbol-badge o-badge">O</div>
        </div>

    </main>

    <div id="dc-modal" class="modal hidden">
        <div class="modal-box">
            <div class="modal-title">⚠ CONNECTION LOST</div>
            <p class="modal-body">Opponent disconnected. Forfeit victory awarded.</p>
            <a href="/lobby" class="btn btn-accept">RETURN TO LOBBY</a>
        </div>
    </div>

    <script src="/game.js"></script>
</body>
</html>
